[project]
name = "tinybark"
version = "0.1.0"
description = "Underdog Bark 3.0 Clean speech-to-text on tinygrad, ONNX Runtime, PyTorch and Mojo"
# No Mojo or MAX wheels for 3.15 yet.
requires-python = ">=3.12,<3.15"
license = "MIT"
dependencies = [
  "constriction",
  "huggingface-hub",
  "numpy",
  "onnxruntime-webgpu>=1.27.0",
  "safetensors>=0.8.0",
  "tinygrad @ git+https://github.com/tinygrad/tinygrad@45fc5ae734a2673c7837835f25e5dbab8b1385d7",
]

[project.optional-dependencies]
# Exporting the ONNX graphs on first use (tinybark.ort.load()).
export = ["onnx", "onnxscript", "torch", "transformers>=5.19"]
# librosa: transformers' ParakeetFeatureExtractor needs it.
pytorch = ["librosa", "torch", "transformers>=5.19"]
# Pinned to the nightly tinybark-mojo was validated with (both clips, 6/6 runs).
mojo = ["max==26.8.0.dev2026102305", "mojo==1.3.0.dev2026102305"]

[dependency-groups]
dev = [
  "pytest",
  "tinybark[export,pytorch,mojo]",
  # Listed so it comes from the ROCm index too: sources only apply to direct dependencies.
  "triton-rocm; sys_platform == 'linux'",
]

[tool.uv]
# The PyTorch and Modular indexes publish no upload times, so the global
# exclude-newer cooldown would filter out every one of their wheels.
exclude-newer-package = { torch = false, triton-rocm = false, mojo = false, mojo-compiler = false, max = false, max-core = false, max-mojo-libs = false, max-shmem-libs = false, mblack = false, mojo-lldb-libs = false, mojo-lsp-server = false, mojo-compiler-mojo-libs = false }

[tool.uv.sources]
tinybark = { workspace = true }
torch = { index = "pytorch-rocm" }
triton-rocm = { index = "pytorch-rocm" }

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm7.2"
explicit = true

[[tool.uv.index]]
name = "modular-nightly"
url = "https://whl.modular.com/nightly/simple/"

[tool.pytest.ini_options]
addopts = "-s"
# transformers' generate() notice, also printed by stt's bark.py.
filterwarnings = ["ignore:Using the model-agnostic default `max_length`:UserWarning"]
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
